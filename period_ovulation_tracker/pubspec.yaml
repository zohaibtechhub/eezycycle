name: period_ovulation_tracker
description: "Period and Ovulation Tracker"
publish_to: 'none'

version: 1.1.0+15

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  device_preview: ^1.3.1
  lottie: ^3.3.3
  hugeicons: ^1.1.7
  http: ^1.6.0
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  gradient_circular_progress_indicator: ^0.0.4
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  scrollable_positioned_list: ^0.3.8
  auto_size_text: ^3.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  pinput: ^6.0.2
  story_view: ^0.16.6
  firebase_core: ^4.4.0
  onesignal_flutter: ^5.7.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/articles/
    - assets/articles/articles.json
    - assets/relationship_tips/
    - assets/relationship_tips/tips.json
    - assets/pregnancy/
    - assets/pregnancy/images/
    - assets/pregnancy/images/baby/
    - assets/pregnancy/images/body/
    - assets/pregnancy/images/size/
    - assets/pregnancy/weekly_insights.json
    - assets/pregnancy/weekly_suggestions.json
    - assets/cycle/
    - assets/cycle/images/
    - assets/cycle/daily_insights.json
    - assets/cycle/daily_suggestions.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/inter-medium.ttf
          weight: 500